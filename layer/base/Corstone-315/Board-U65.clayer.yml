layer:
  type: Board
  description: Base configuration of SSE-315 FVP with Ethos U65
  for-board: ARM::SSE-315
  for-device: ARM::SSE-315-FVP

  connections:
    - connect: Corstone-315-U65
      provides:
        - CMSIS_USART
        - CMSIS_VIO
        - STDIN
        - STDOUT
        - STDERR
        - Heap: 98304
      consumes:
        - CMSIS-RTOS2

  define:
    - CMSIS_target_header: \"Corstone-315.h\"

  packs:
    - pack: ARM::CMSIS
    - pack: ARM::CMSIS-Compiler@^2.3.0
    - pack: ARM::CMSIS-Ethos-U@^1.0.0
    - pack: ARM::SSE_315_BSP@1.0.0

  components:
    - component: CMSIS:CORE

    - component: CMSIS Driver:USART
    - component: CMSIS Driver:VIO:Virtual

    - component: CMSIS-Compiler:CORE
    - component: CMSIS-Compiler:STDERR:UART&CMSIS
    - component: CMSIS-Compiler:STDIN:UART&CMSIS
    - component: CMSIS-Compiler:STDOUT:UART&CMSIS

    - component: Device:Definition
    - component: Device:Startup&C Startup

    - component: Device:Native Driver:SysCounter
    - component: Device:Native Driver:SysTimer
    - component: Device:Native Driver:Timeout
    - component: Device:Native Driver:UART

    - component: Machine Learning:NPU Support:Ethos-U Driver&Generic U65
      define:
        - ETHOSU_MACS: 256

  groups:
    - group: Board
      files:
        - file: main.c
        - file: main.h
        - file: ethos_setup.c
        - file: ethosu_os_rtos2.c
        - file: ethosu_dcache.c

  linker:
    - regions: RTE/Device/SSE-315-FVP/regions_SSE-315.h
